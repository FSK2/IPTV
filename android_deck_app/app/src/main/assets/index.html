<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DevDeck - YouTube PC Companion</title>
    <!-- Tailwind CSS CDN & Material Symbols -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 12px;
            background-color: #0f0f12;
            color: #ffffff;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            min-height: 100vh;
        }

        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start max-w-lg mx-auto">

<!-- VIEW: TUBE PLAYER SCREEN (YOUTUBE PC COMPANION) -->
<div id="view-tube" class="tab-content space-y-3.5 w-full">
  <!-- Header Card with Branding & Voice Toggle -->
  <div class="bg-gray-900 rounded-xl p-3.5 border border-purple-500/40 shadow-xl flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-500/20 via-amber-500/20 to-purple-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 shadow-md">
        <span class="material-symbols-outlined text-2xl">smart_display</span>
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <h2 class="text-sm font-bold text-white font-mono uppercase tracking-wider">TUBE PLAYER</h2>
          <span class="px-1.5 py-0.2 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[9px] font-mono font-bold">STUDIO</span>
        </div>
        <p class="text-[10px] text-gray-400 font-mono">YouTube PC Companion • 1000Hz Ultra-Low Latency</p>
      </div>
    </div>
    <!-- Voice Toggle -->
    <button id="btn-voice-toggle-tube" onclick="toggleVoiceAnnouncements()" class="text-[10px] font-mono px-2.5 py-1 rounded-md border flex items-center gap-1.5 transition-all bg-purple-500/20 text-purple-300 border-purple-500/50 hover:bg-purple-500/30 active:scale-95 shadow-sm" title="Toggle Voice Feedback">
      <span id="voice-toggle-icon-tube" class="material-symbols-outlined text-xs text-purple-400">record_voice_over</span>
      <span id="voice-toggle-label-tube" class="font-bold">VOICE ON</span>
    </button>
  </div>

  <!-- Big Prominent SKIP AD Button (Tab + Enter) -->
  <div class="rounded-xl p-1 bg-gradient-to-r from-amber-500/40 via-yellow-400/40 to-amber-500/40 shadow-[0_0_20px_rgba(245,158,11,0.25)]">
    <button onclick="triggerSkipAd()" class="w-full py-3.5 px-4 rounded-lg bg-gray-900 hover:bg-amber-500/10 border border-amber-500/60 active:scale-[0.98] transition-all flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-amber-500/20 border border-amber-500/50 flex items-center justify-center text-amber-400 shadow-inner animate-pulse">
          <span class="material-symbols-outlined text-2xl">fast_forward</span>
        </div>
        <div class="text-left">
          <div class="text-sm font-bold text-amber-300 font-mono tracking-wider flex items-center gap-2">
            <span>SKIP AD</span>
            <span class="px-1.5 py-0.2 rounded bg-amber-400 text-black text-[9px] font-bold">TAB + ENTER</span>
          </div>
          <div class="text-[10px] text-gray-400 font-mono">Tap once countdown allows skipping in YouTube player</div>
        </div>
      </div>
      <div class="flex items-center gap-1 text-amber-400 font-mono text-xs font-bold bg-amber-500/10 px-2.5 py-1.5 rounded-md border border-amber-500/30">
        <span>SKIP</span>
        <span class="material-symbols-outlined text-sm">skip_next</span>
      </div>
    </button>
  </div>

  <!-- Primary Transport Matrix (Play, Pause, Stop, Mute) -->
  <div class="bg-gray-900 rounded-xl p-3 border border-gray-700/60 shadow-lg space-y-2">
    <div class="text-[10px] font-mono text-gray-400 uppercase tracking-wider flex items-center justify-between">
      <span>Transport Controls</span>
      <span class="text-emerald-400">Tactile Mechanical</span>
    </div>
    <div class="grid grid-cols-4 gap-2">
      <!-- Play -->
      <button onclick="triggerMediaPlay()" class="py-3 rounded-lg bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 font-mono font-bold text-center border border-emerald-500/50 flex flex-col items-center justify-center gap-1 active:scale-95 transition-all shadow-md">
        <span class="material-symbols-outlined text-xl">play_arrow</span>
        <span class="text-xs">PLAY</span>
      </button>
      <!-- Pause -->
      <button onclick="triggerMediaPause()" class="py-3 rounded-lg bg-amber-600/20 hover:bg-amber-600/30 text-amber-400 font-mono font-bold text-center border border-amber-500/50 flex flex-col items-center justify-center gap-1 active:scale-95 transition-all shadow-md">
        <span class="material-symbols-outlined text-xl">pause</span>
        <span class="text-xs">PAUSE</span>
      </button>
      <!-- Stop -->
      <button onclick="triggerMediaStop()" class="py-3 rounded-lg bg-red-600/20 hover:bg-red-600/30 text-red-400 font-mono font-bold text-center border border-red-500/50 flex flex-col items-center justify-center gap-1 active:scale-95 transition-all shadow-md">
        <span class="material-symbols-outlined text-xl">stop</span>
        <span class="text-xs">STOP</span>
      </button>
      <!-- Mute -->
      <button onclick="triggerMediaMute()" class="py-3 rounded-lg bg-gray-800 hover:bg-gray-700 text-purple-300 font-mono font-bold text-center border border-purple-500/40 flex flex-col items-center justify-center gap-1 active:scale-95 transition-all shadow-md">
        <span class="material-symbols-outlined text-xl">volume_off</span>
        <span class="text-xs">MUTE</span>
      </button>
    </div>
  </div>

  <!-- YouTube Seek Interval & Scrub Hub -->
  <div class="bg-gray-900 rounded-xl p-3 border border-purple-500/30 shadow-lg space-y-2.5">
    <!-- Interval Chips -->
    <div class="flex items-center justify-between p-2 rounded-lg bg-gray-800 border border-gray-700/60">
      <span class="text-[10px] font-mono text-purple-300 font-bold uppercase flex items-center gap-1">
        <span class="material-symbols-outlined text-xs text-purple-400">timer</span>
        <span>SEEK INTERVAL:</span>
      </span>
      <div class="flex items-center gap-1.5">
        <button id="chip-seek-15-tube" onclick="setSeekInterval(15)" class="px-2.5 py-1 rounded-md text-[11px] font-mono font-bold transition-all bg-purple-500 text-black shadow-md border border-purple-400">15s</button>
        <button id="chip-seek-25-tube" onclick="setSeekInterval(25)" class="px-2.5 py-1 rounded-md text-[11px] font-mono font-bold transition-all bg-gray-800 text-purple-300 hover:text-white border border-gray-700">25s</button>
        <button id="chip-seek-30-tube" onclick="setSeekInterval(30)" class="px-2.5 py-1 rounded-md text-[11px] font-mono font-bold transition-all bg-gray-800 text-purple-300 hover:text-white border border-gray-700">30s</button>
        <button id="chip-seek-60-tube" onclick="setSeekInterval(60)" class="px-2.5 py-1 rounded-md text-[11px] font-mono font-bold transition-all bg-gray-800 text-purple-300 hover:text-white border border-gray-700">60s</button>
      </div>
    </div>

    <!-- YouTube Discrete Seek Buttons -->
    <div class="grid grid-cols-2 gap-2">
      <!-- Seek Reverse -->
      <button onclick="triggerSeekJump('reverse')" class="py-3 rounded-lg bg-purple-900/30 text-purple-300 font-mono font-bold text-center hover:border-purple-400 border border-purple-500/40 flex flex-col items-center justify-center select-none active:scale-95 transition-all shadow-sm">
        <div class="flex items-center gap-1">
          <span class="material-symbols-outlined text-base">fast_rewind</span>
          <span id="label-seek-rev-tube">-15s</span>
        </div>
        <span class="text-[8px] text-purple-400/80 font-mono mt-0.5">TAP DISCRETE JUMP</span>
      </button>
      <!-- Seek Forward -->
      <button onclick="triggerSeekJump('forward')" class="py-3 rounded-lg bg-purple-900/30 text-purple-300 font-mono font-bold text-center hover:border-purple-400 border border-purple-500/40 flex flex-col items-center justify-center select-none active:scale-95 transition-all shadow-sm">
        <div class="flex items-center gap-1">
          <span id="label-seek-fwd-tube">+15s</span>
          <span class="material-symbols-outlined text-base">fast_forward</span>
        </div>
        <span class="text-[8px] text-purple-400/80 font-mono mt-0.5">TAP DISCRETE JUMP</span>
      </button>
    </div>
  </div>

  <!-- Volume Turbo Sliders -->
  <div class="bg-gray-900 rounded-xl p-3 border border-gray-700/60 shadow-lg space-y-2">
    <div class="text-[10px] font-mono text-gray-400 uppercase tracking-wider flex items-center justify-between">
      <span>Volume Controls</span>
      <span class="text-cyan-400">Tap Step • Hold Turbo</span>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <!-- Volume Down -->
      <button onpointerdown="handleVolDownStart(event)" onpointerup="handleVolDownEnd(event)" onpointercancel="handleVolDownCancel(event)" class="py-3 rounded-lg bg-gray-800 text-purple-300 font-mono font-bold text-center hover:border-purple-500 border border-gray-700 flex flex-col items-center justify-center select-none active:scale-95 transition-all shadow-sm" style="touch-action: none;">
        <div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-base">volume_down</span> VOL -</div>
        <span class="text-[8px] text-gray-400 font-mono mt-0.5">HOLD 0% TOTAL SILENCE</span>
      </button>
      <!-- Volume Up -->
      <button onpointerdown="handleVolUpStart(event)" onpointerup="handleVolUpEnd(event)" onpointercancel="handleVolUpCancel(event)" class="py-3 rounded-lg bg-gray-800 text-purple-300 font-mono font-bold text-center hover:border-purple-500 border border-gray-700 flex flex-col items-center justify-center select-none active:scale-95 transition-all shadow-sm" style="touch-action: none;">
        <div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-base">volume_up</span> VOL +</div>
        <span class="text-[8px] text-gray-400 font-mono mt-0.5">HOLD 100% TURBO MAX</span>
      </button>
    </div>
  </div>

  <!-- YouTube Direct Display & Playback Hotkeys -->
  <div class="bg-gray-900 rounded-xl p-3 border border-cyan-500/30 shadow-lg space-y-2">
    <div class="text-[10px] font-mono text-gray-400 uppercase tracking-wider flex items-center justify-between">
      <span>YouTube Navigation &amp; Actions</span>
      <span class="text-cyan-400">Direct PC Keys</span>
    </div>
    <div class="grid grid-cols-4 gap-2 text-center font-mono font-bold">
      <!-- Fullscreen [F] -->
      <button onclick="triggerKey('f', 'fullscreen')" class="py-2.5 rounded-lg bg-gray-800 text-cyan-300 hover:border-cyan-400 border border-gray-700 flex flex-col items-center justify-center active:scale-95 transition-all shadow-sm">
        <span class="material-symbols-outlined text-lg mb-0.5">fullscreen</span>
        <span class="text-[10px]">FULL [F]</span>
      </button>
      <!-- Theater Mode [T] -->
      <button onclick="triggerKey('t', 'width_full')" class="py-2.5 rounded-lg bg-gray-800 text-cyan-300 hover:border-cyan-400 border border-gray-700 flex flex-col items-center justify-center active:scale-95 transition-all shadow-sm">
        <span class="material-symbols-outlined text-lg mb-0.5">width_full</span>
        <span class="text-[10px]">THEATER [T]</span>
      </button>
      <!-- Captions [C] -->
      <button onclick="triggerKey('c', 'closed_caption')" class="py-2.5 rounded-lg bg-gray-800 text-cyan-300 hover:border-cyan-400 border border-gray-700 flex flex-col items-center justify-center active:scale-95 transition-all shadow-sm">
        <span class="material-symbols-outlined text-lg mb-0.5">closed_caption</span>
        <span class="text-[10px]">CAPTIONS [C]</span>
      </button>
      <!-- Miniplayer [I] -->
      <button onclick="triggerKey('i', 'picture_in_picture')" class="py-2.5 rounded-lg bg-gray-800 text-cyan-300 hover:border-cyan-400 border border-gray-700 flex flex-col items-center justify-center active:scale-95 transition-all shadow-sm">
        <span class="material-symbols-outlined text-lg mb-0.5">picture_in_picture</span>
        <span class="text-[10px]">MINI [I]</span>
      </button>
    </div>

    <!-- YouTube Direct Actions (Like, Share, Save) -->
    <div class="grid grid-cols-3 gap-2 text-center font-mono font-bold pt-1">
      <!-- LIKE (Thumbs Up) -->
      <button onclick="triggerYouTubeAction('like')" class="py-3 rounded-lg bg-emerald-950/40 text-emerald-400 hover:border-emerald-400 border border-emerald-500/50 flex flex-col items-center justify-center gap-1 active:scale-95 transition-all shadow-md">
        <div class="flex items-center gap-1">
          <span class="material-symbols-outlined text-lg text-emerald-400">thumb_up</span>
          <span class="text-xs font-bold text-white">LIKE</span>
        </div>
        <span class="text-[8px] text-emerald-300/80 font-mono tracking-wider">THUMBS UP</span>
      </button>

      <!-- SHARE -->
      <button onclick="triggerYouTubeAction('share')" class="py-3 rounded-lg bg-cyan-950/40 text-cyan-300 hover:border-cyan-400 border border-cyan-500/50 flex flex-col items-center justify-center gap-1 active:scale-95 transition-all shadow-md">
        <div class="flex items-center gap-1">
          <span class="material-symbols-outlined text-lg text-cyan-300">share</span>
          <span class="text-xs font-bold text-white">SHARE</span>
        </div>
        <span class="text-[8px] text-cyan-300/80 font-mono tracking-wider">LINK / MODAL</span>
      </button>

      <!-- SAVE -->
      <button onclick="triggerYouTubeAction('save')" class="py-3 rounded-lg bg-purple-950/40 text-purple-300 hover:border-purple-400 border border-purple-500/50 flex flex-col items-center justify-center gap-1 active:scale-95 transition-all shadow-md">
        <div class="flex items-center gap-1">
          <span class="material-symbols-outlined text-lg text-purple-300">playlist_add</span>
          <span class="text-xs font-bold text-white">SAVE</span>
        </div>
        <span class="text-[8px] text-purple-300/80 font-mono tracking-wider">TO PLAYLIST</span>
      </button>
    </div>
  </div>

  <!-- YouTube Precision Playback Speed Control -->
  <div class="bg-gray-900 rounded-xl p-3 border border-amber-500/40 shadow-lg space-y-2.5">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-amber-400 text-lg">speed</span>
        <span class="text-xs font-bold text-white font-mono uppercase tracking-wider">PLAYBACK SPEED</span>
      </div>
      <span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 text-[9px] font-mono font-bold" id="tube-active-speed-badge">1.00x NORMAL</span>
    </div>

    <!-- Step Controls: Slow, 1.0x Normal, Fast -->
    <div class="grid grid-cols-3 gap-2">
      <!-- SLOW (<) -->
      <button onclick="adjustPlaybackSpeed('down')" class="py-2.5 px-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-amber-300 font-mono font-bold text-center border border-gray-700 flex items-center justify-center gap-1 active:scale-95 transition-all shadow-sm">
        <span class="material-symbols-outlined text-base">arrow_left</span>
        <span class="text-xs">SLOW (&lt;)</span>
      </button>

      <!-- 1.0x NORMAL (Reset) -->
      <button onclick="setPlaybackSpeed('1.00')" class="py-2.5 px-2 rounded-lg bg-amber-500 hover:bg-amber-400 text-black font-mono font-bold text-center flex items-center justify-center gap-1 active:scale-95 transition-all shadow-md">
        <span class="material-symbols-outlined text-base">restart_alt</span>
        <span class="text-xs">1.0x NORMAL</span>
      </button>

      <!-- FAST (>) -->
      <button onclick="adjustPlaybackSpeed('up')" class="py-2.5 px-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-amber-300 font-mono font-bold text-center border border-gray-700 flex items-center justify-center gap-1 active:scale-95 transition-all shadow-sm">
        <span class="text-xs">FAST (&gt;)</span>
        <span class="material-symbols-outlined text-base">arrow_right</span>
      </button>
    </div>

    <!-- Speed Presets Chips -->
    <div class="flex items-center justify-between gap-1 pt-1 overflow-x-auto scrollbar-none">
      <button id="chip-speed-050" onclick="setPlaybackSpeed('0.50')" class="flex-1 py-1.5 px-1 rounded-md text-[10px] font-mono font-bold transition-all bg-gray-800 text-gray-400 hover:text-white border border-gray-700 text-center">0.5x</button>
      <button id="chip-speed-075" onclick="setPlaybackSpeed('0.75')" class="flex-1 py-1.5 px-1 rounded-md text-[10px] font-mono font-bold transition-all bg-gray-800 text-gray-400 hover:text-white border border-gray-700 text-center">0.75x</button>
      <button id="chip-speed-100" onclick="setPlaybackSpeed('1.00')" class="flex-1 py-1.5 px-1 rounded-md text-[10px] font-mono font-bold transition-all bg-amber-500 text-black font-bold border border-amber-400 text-center shadow-sm">1.0x</button>
      <button id="chip-speed-125" onclick="setPlaybackSpeed('1.25')" class="flex-1 py-1.5 px-1 rounded-md text-[10px] font-mono font-bold transition-all bg-gray-800 text-gray-400 hover:text-white border border-gray-700 text-center">1.25x</button>
      <button id="chip-speed-150" onclick="setPlaybackSpeed('1.50')" class="flex-1 py-1.5 px-1 rounded-md text-[10px] font-mono font-bold transition-all bg-gray-800 text-gray-400 hover:text-white border border-gray-700 text-center">1.5x</button>
      <button id="chip-speed-200" onclick="setPlaybackSpeed('2.00')" class="flex-1 py-1.5 px-1 rounded-md text-[10px] font-mono font-bold transition-all bg-gray-800 text-gray-400 hover:text-white border border-gray-700 text-center">2.0x</button>
    </div>
  </div>
</div>

<div class="mt-4 text-xs text-gray-500 font-mono text-center" id="status">Ready</div>

<script>
    let voiceEnabled = true;
    let currentSeekInterval = 15;
    let currentSpeed = 1.0;

    let volDownTimer = null;
    let volUpTimer = null;
    let isVolDownHold = false;
    let isVolUpHold = false;

    function updateStatus(msg) {
        const el = document.getElementById('status');
        if (el) el.innerText = msg;
    }

    function speak(text) {
        if (!voiceEnabled) return;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }
    }

    function toggleVoiceAnnouncements() {
        voiceEnabled = !voiceEnabled;
        const label = document.getElementById('voice-toggle-label-tube');
        const icon = document.getElementById('voice-toggle-icon-tube');
        const btn = document.getElementById('btn-voice-toggle-tube');
        if (voiceEnabled) {
            if (label) label.innerText = 'VOICE ON';
            if (icon) icon.innerText = 'record_voice_over';
            if (btn) {
                btn.className = "text-[10px] font-mono px-2.5 py-1 rounded-md border flex items-center gap-1.5 transition-all bg-purple-500/20 text-purple-300 border-purple-500/50 hover:bg-purple-500/30 active:scale-95 shadow-sm";
            }
            speak("Voice announcements enabled");
        } else {
            if (label) label.innerText = 'VOICE OFF';
            if (icon) icon.innerText = 'voice_over_off';
            if (btn) {
                btn.className = "text-[10px] font-mono px-2.5 py-1 rounded-md border flex items-center gap-1.5 transition-all bg-gray-800 text-gray-400 border-gray-700 hover:bg-gray-700 active:scale-95 shadow-sm";
            }
        }
    }

    function sendMediaCommand(cmd) {
        updateStatus("Action: " + cmd);
        if (window.AndroidBridge && window.AndroidBridge.handleMediaCommand) {
            window.AndroidBridge.handleMediaCommand(cmd);
        } else {
            console.log("Bridge action:", cmd);
        }
    }

    function sendSeekCommand(seconds) {
        updateStatus("Seek: " + seconds + "s");
        if (window.AndroidBridge && window.AndroidBridge.handleSeek) {
            window.AndroidBridge.handleSeek(seconds);
        } else {
            console.log("Bridge seek:", seconds);
        }
    }

    function triggerSkipAd() {
        speak("Skipping Ad");
        sendMediaCommand('skip_ad');
    }

    function triggerMediaPlay() {
        speak("Play");
        sendMediaCommand('play');
    }

    function triggerMediaPause() {
        speak("Pause");
        sendMediaCommand('pause');
    }

    function triggerMediaStop() {
        speak("Stop");
        sendMediaCommand('stop');
    }

    function triggerMediaMute() {
        speak("Mute");
        sendMediaCommand('mute');
    }

    function setSeekInterval(seconds) {
        currentSeekInterval = seconds;
        speak(seconds + " seconds seek interval");
        updateStatus("Seek interval set to " + seconds + "s");

        const chips = [15, 25, 30, 60];
        chips.forEach(s => {
            const chip = document.getElementById('chip-seek-' + s + '-tube');
            if (chip) {
                if (s === seconds) {
                    chip.className = "px-2.5 py-1 rounded-md text-[11px] font-mono font-bold transition-all bg-purple-500 text-black shadow-md border border-purple-400";
                } else {
                    chip.className = "px-2.5 py-1 rounded-md text-[11px] font-mono font-bold transition-all bg-gray-800 text-purple-300 hover:text-white border border-gray-700";
                }
            }
        });

        const revLabel = document.getElementById('label-seek-rev-tube');
        const fwdLabel = document.getElementById('label-seek-fwd-tube');
        if (revLabel) revLabel.innerText = '-' + seconds + 's';
        if (fwdLabel) fwdLabel.innerText = '+' + seconds + 's';
    }

    function triggerSeekJump(direction) {
        const secs = (direction === 'forward') ? currentSeekInterval : -currentSeekInterval;
        speak((direction === 'forward' ? "Forward " : "Rewind ") + currentSeekInterval + " seconds");
        sendSeekCommand(secs);
    }

    function handleVolDownStart(e) {
        if (e && e.target && e.target.setPointerCapture) {
            try { e.target.setPointerCapture(e.pointerId); } catch(err) {}
        }
        isVolDownHold = false;
        volDownTimer = setTimeout(() => {
            isVolDownHold = true;
            speak("Volume silence");
            sendMediaCommand('vol_zero');
        }, 500);
    }

    function handleVolDownEnd(e) {
        if (volDownTimer) {
            clearTimeout(volDownTimer);
            volDownTimer = null;
        }
        if (!isVolDownHold) {
            speak("Volume Down");
            sendMediaCommand('vol_down');
        }
        isVolDownHold = false;
        if (e && e.target && e.target.releasePointerCapture) {
            try { e.target.releasePointerCapture(e.pointerId); } catch(err) {}
        }
    }

    function handleVolDownCancel(e) {
        if (volDownTimer) {
            clearTimeout(volDownTimer);
            volDownTimer = null;
        }
        isVolDownHold = false;
        if (e && e.target && e.target.releasePointerCapture) {
            try { e.target.releasePointerCapture(e.pointerId); } catch(err) {}
        }
    }

    function handleVolUpStart(e) {
        if (e && e.target && e.target.setPointerCapture) {
            try { e.target.setPointerCapture(e.pointerId); } catch(err) {}
        }
        isVolUpHold = false;
        volUpTimer = setTimeout(() => {
            isVolUpHold = true;
            speak("Volume Turbo Max");
            sendMediaCommand('vol_max');
        }, 500);
    }

    function handleVolUpEnd(e) {
        if (volUpTimer) {
            clearTimeout(volUpTimer);
            volUpTimer = null;
        }
        if (!isVolUpHold) {
            speak("Volume Up");
            sendMediaCommand('vol_up');
        }
        isVolUpHold = false;
        if (e && e.target && e.target.releasePointerCapture) {
            try { e.target.releasePointerCapture(e.pointerId); } catch(err) {}
        }
    }

    function handleVolUpCancel(e) {
        if (volUpTimer) {
            clearTimeout(volUpTimer);
            volUpTimer = null;
        }
        isVolUpHold = false;
        if (e && e.target && e.target.releasePointerCapture) {
            try { e.target.releasePointerCapture(e.pointerId); } catch(err) {}
        }
    }

    function triggerKey(key, iconName) {
        const names = { 'f': 'Fullscreen', 't': 'Theater mode', 'c': 'Captions', 'i': 'Mini player' };
        speak(names[key] || ("Key " + key));
        updateStatus("Key action: " + key);
        if (window.AndroidBridge && window.AndroidBridge.handleKeyShortcut) {
            window.AndroidBridge.handleKeyShortcut(key);
        } else {
            console.log("Bridge key action:", key);
        }
    }

    function triggerYouTubeAction(action) {
        const names = { 'like': 'Like video', 'share': 'Share video', 'save': 'Save to playlist' };
        speak(names[action] || action);
        updateStatus("YouTube Action: " + action);
        if (window.AndroidBridge && window.AndroidBridge.handleYouTubeAction) {
            window.AndroidBridge.handleYouTubeAction(action);
        } else {
            console.log("Bridge YT action:", action);
        }
    }

    function adjustPlaybackSpeed(direction) {
        const speeds = [0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0];
        let idx = speeds.indexOf(currentSpeed);
        if (idx === -1) idx = 3; // 1.0

        if (direction === 'down' && idx > 0) {
            idx--;
        } else if (direction === 'up' && idx < speeds.length - 1) {
            idx++;
        }
        const targetSpeed = speeds[idx].toFixed(2);
        setPlaybackSpeed(targetSpeed, direction);
    }

    function setPlaybackSpeed(speedStr, dir) {
        const speedNum = parseFloat(speedStr);
        currentSpeed = speedNum;
        speak(speedStr + " speed");
        updateStatus("Speed: " + speedStr + "x");

        const badge = document.getElementById('tube-active-speed-badge');
        if (badge) {
            badge.innerText = speedStr + (speedNum === 1.00 ? "x NORMAL" : "x");
        }

        const presets = ['050', '075', '100', '125', '150', '200'];
        presets.forEach(p => {
            const chip = document.getElementById('chip-speed-' + p);
            if (chip) {
                const chipVal = (parseInt(p) / 100).toFixed(2);
                if (chipVal === speedNum.toFixed(2)) {
                    chip.className = "flex-1 py-1.5 px-1 rounded-md text-[10px] font-mono font-bold transition-all bg-amber-500 text-black font-bold border border-amber-400 text-center shadow-sm";
                } else {
                    chip.className = "flex-1 py-1.5 px-1 rounded-md text-[10px] font-mono font-bold transition-all bg-gray-800 text-gray-400 hover:text-white border border-gray-700 text-center";
                }
            }
        });

        if (window.AndroidBridge && window.AndroidBridge.handleSpeedCommand) {
            if (dir === 'down' || dir === 'up') {
                window.AndroidBridge.handleSpeedCommand(dir);
            } else {
                window.AndroidBridge.handleSpeedCommand(speedStr);
            }
        } else {
            console.log("Bridge speed action:", speedStr, dir);
        }
    }
</script>
